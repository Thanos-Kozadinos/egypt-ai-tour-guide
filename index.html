<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161311">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Egypt Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="backBtn" aria-label="Back" hidden>&#8592;</button>
  <h1 id="title">Egypt Guide</h1>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">&#9788;</button>
</header>

<main id="view" class="view" aria-live="polite"></main>

<div id="player" class="player" hidden>
  <img id="pArt" class="player-art" alt="">
  <div class="player-main">
    <div class="player-title" id="pTitle"></div>
    <div class="player-bar"><input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Seek"></div>
    <div class="player-meta"><span id="pTime">0:00</span><span id="pQueue"></span></div>
  </div>
  <button class="iconbtn" id="pSpeed" aria-label="Speed">1x</button>
  <button class="iconbtn big" id="pPlay" aria-label="Play or pause">&#9654;</button>
  <button class="iconbtn" id="pNext" aria-label="Next">&#9197;</button>
  <button class="iconbtn" id="pClose" aria-label="Close player">&#10005;</button>
</div>

<nav class="tabs" id="tabs">
  <a href="#/today" data-tab="today"><span class="ico">&#128197;</span>Today</a>
  <a href="#/search" data-tab="search"><span class="ico">&#128269;</span>Search</a>
  <a href="#/browse" data-tab="browse"><span class="ico">&#127963;</span>Places</a>
  <a href="#/phrases" data-tab="phrases"><span class="ico">&#128483;</span>Phrases</a>
  <a href="#/more" data-tab="more"><span class="ico">&#9881;</span>More</a>
</nav>

<div id="toast" class="toast" hidden></div>
<div id="showcard" class="showcard" hidden></div>

<audio id="narration" preload="none"></audio>
<audio id="phraseAudio" preload="none"></audio>

<script src="app.js"></script>
</body>
</html>
